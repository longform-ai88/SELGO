<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 – SELGA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Manrope", "Segoe UI", sans-serif;
  background: radial-gradient(circle at 10% 10%, #d8ccff 0%, #e8e2ff 35%, #ddd6f5 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #102039;
  padding: 24px;
}
.wrap {
  text-align: center;
  background: #fff;
  border-radius: 20px;
  padding: 48px 40px;
  border: 1px solid #dce3ef;
  box-shadow: 0 20px 60px rgba(16,32,57,0.12);
  max-width: 420px;
  width: 100%;
}
.logo {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: 5px;
  background: linear-gradient(120deg, #a259ff 0%, #ff6a00 40%, #ffb300 70%, #00c6ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 20px;
}
h1 { font-size: 72px; font-weight: 800; color: #e0daf5; line-height: 1; margin-bottom: 8px; }
p { font-size: 15px; color: #476086; margin-bottom: 28px; }
a {
  display: inline-block;
  background: linear-gradient(180deg, #ff8e2b 0%, #ff6a00 100%);
  color: #fff;
  font-weight: 800;
  font-size: 15px;
  padding: 13px 32px;
  border-radius: 10px;
  text-decoration: none;
  box-shadow: 0 8px 20px rgba(255,106,0,0.24);
}
a:hover { filter: brightness(0.95); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">SELGA</div>
  <h1>404</h1>
  <p>Siden du leter etter finnes ikke.</p>
  <a href="/">Tilbake til forsiden</a>
</div>
</body>
</html>
